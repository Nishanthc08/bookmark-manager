name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt update && sudo apt install -y build-essential debhelper lintian

      - name: Build source package
        run: dpkg-buildpackage -us -uc -d

      - name: Copy .deb to workspace
        run: cp ../bm_*.deb ./

      - name: Lint the package
        run: lintian --profile debian ./bm_*.deb || true

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: bm-deb
          path: ./bm_*.deb

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./bm_*.deb
